<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guardiões do Folclore</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;600;700;800&family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: barra de recursos no topo; à esquerda o medalhão do herói com atributos; à direita o salão do jogo com abas.
   Visual: noite na mata, painéis de madeira escura com filetes de latão, ilustrações emolduradas como quadros. */
:root{
  --noite:#0a1613; --casca:#10221d; --casca-2:#163028; --casca-3:#1d3b31; --borda:#2a4a3e;
  --latao:#d6a24a; --latao-2:#f1cb78; --brasa:#e2602d; --jade:#3fae7f; --lua:#8fc0d4; --sangue:#c8423a;
  --texto:#efe7d4; --texto-2:#a5b7ab; --tinta:#140d08;
  --f-display:'Eczar','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --f-body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--noite)}
body{color:var(--texto);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(ellipse 50% 40% at 85% -5%,rgba(143,192,212,.13),transparent 70%),radial-gradient(ellipse 45% 35% at 0% 100%,rgba(226,96,45,.09),transparent 70%);background-attachment:fixed}
button{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--latao-2);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-block:14px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

/* ---------- Topo ---------- */
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.4vw,32px);color:var(--latao-2);letter-spacing:.01em;text-shadow:0 2px 0 var(--tinta),0 0 24px rgba(214,162,74,.25)}
.logo span{font-size:11px;font-weight:700;font-stretch:78%;text-transform:uppercase;letter-spacing:.22em;color:var(--texto-2);margin-top:4px}
.recursos{display:flex;gap:8px;flex-wrap:wrap}
.rec{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,var(--casca-2),var(--casca));border:1px solid var(--borda);border-radius:10px;padding:6px 10px;min-width:0}
.rec svg.ic{width:22px;height:22px;flex:none}
.rec-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.rec-txt b{font-size:15px;font-weight:800}
.rec-txt small{font-size:11px;color:var(--texto-2);white-space:nowrap}
.rec-barra{width:88px;height:6px;border-radius:3px;background:var(--noite);overflow:hidden;margin-top:3px}
.rec-barra i{display:block;height:100%;transition:width .5s ease}
.mais{border:1px solid var(--borda);background:var(--casca-3);border-radius:7px;width:26px;height:26px;display:grid;place-items:center;cursor:pointer;font-weight:800;padding:0;flex:none}
.mais:hover{border-color:var(--latao);color:var(--latao-2)}

/* ---------- Estrutura ---------- */
.jogo{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:920px){.jogo{grid-template-columns:1fr}}
.painel{background:linear-gradient(180deg,var(--casca-2),var(--casca));border:1px solid var(--borda);border-radius:12px;box-shadow:inset 0 1px 0 rgba(241,203,120,.07),0 12px 30px rgba(0,0,0,.3);min-width:0}
.rotulo{font-size:11px;font-weight:700;font-stretch:78%;text-transform:uppercase;letter-spacing:.16em;color:var(--texto-2)}

/* ---------- Herói lateral ---------- */
.heroi{padding:18px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:920px){.heroi{position:static}}
.heroi-topo{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.medalhao{width:132px;height:132px;border-radius:50%;padding:5px;background:conic-gradient(from 200deg,var(--latao),var(--latao-2),var(--latao),#8b6326,var(--latao));box-shadow:0 0 0 1px var(--tinta),0 8px 24px rgba(0,0,0,.5);position:relative}
.medalhao-in{width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#2f6150,#10261f 70%);border:2px solid var(--tinta)}
.medalhao-in svg{width:100%;height:100%}
.nivel-badge{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:var(--tinta);border:2px solid var(--latao);color:var(--latao-2);font-family:var(--f-display);font-weight:800;font-size:16px;min-width:40px;height:30px;padding:0 8px;border-radius:15px;display:grid;place-items:center}
.heroi-nome{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.1;margin-top:8px;overflow-wrap:anywhere}
.titulo-rank{color:var(--latao);font-size:12px;font-weight:700;font-stretch:80%;text-transform:uppercase;letter-spacing:.14em}
.xp{width:100%}
.barra{height:8px;border-radius:4px;background:var(--noite);border:1px solid var(--borda);overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--latao),var(--latao-2));transition:width .5s ease}
.xp-num{display:flex;justify-content:space-between;font-size:11.5px;color:var(--texto-2);margin-top:4px}
.atributos{display:flex;flex-direction:column}
.attr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--borda)}
.attr-nome b{display:block;font-size:14px}
.attr-nome small{display:block;font-size:11.5px;color:var(--texto-2);line-height:1.3}
.attr-val{font-family:var(--f-display);font-weight:700;font-size:21px;text-align:right;min-width:42px;line-height:1}
.attr-val small{display:block;font-family:var(--f-body);font-size:10.5px;color:var(--jade);font-weight:700;margin-top:2px}
.treino{display:flex;align-items:center;gap:4px;border:1px solid var(--borda);background:var(--casca-3);border-radius:8px;padding:5px 7px;cursor:pointer;font-weight:800;font-size:12.5px;min-width:64px;justify-content:center}
.treino svg{width:14px;height:14px}
.treino:hover:not(:disabled){border-color:var(--latao);background:#28473b}
.treino:disabled{opacity:.4;cursor:not-allowed}
.forca-total{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.forca-total div{background:var(--noite);border:1px solid var(--borda);border-radius:8px;padding:8px 10px}
.forca-total b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1}
.mini-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mslot{aspect-ratio:1;border-radius:8px;border:1px solid var(--borda);background:var(--noite);display:grid;place-items:center;position:relative;max-width:100%}
.mslot svg{width:52%;height:52%;opacity:.35}
.mslot.ok{border-color:var(--rar)}
.mslot.ok svg{opacity:1;color:var(--rar)}
.r0{--rar:#cbbf9f}.r1{--rar:var(--lua)}.r2{--rar:var(--brasa)}

/* ---------- Abas ---------- */
.salao{display:flex;flex-direction:column;gap:16px;min-width:0}
.abas{display:flex;gap:2px;border-bottom:1px solid var(--borda);overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{display:flex;align-items:center;gap:7px;border:0;background:none;padding:10px 14px 12px;cursor:pointer;font-weight:700;font-stretch:85%;text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--texto-2);position:relative;white-space:nowrap;flex:none}
.aba svg{width:18px;height:18px}
.aba:hover{color:var(--texto)}
.aba[aria-selected="true"]{color:var(--latao-2)}
.aba[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--latao)}
.aba .ponto{width:8px;height:8px;border-radius:50%;background:var(--brasa);box-shadow:0 0 8px var(--brasa)}
.sec-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.sec-topo h2{font-family:var(--f-display);font-weight:700;font-size:27px;line-height:1.05;margin:0}
.sec-topo p{margin:4px 0 0;color:var(--texto-2);max-width:62ch}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #8b6326;background:linear-gradient(180deg,var(--latao-2),var(--latao));color:var(--tinta);font-weight:800;font-stretch:85%;text-transform:uppercase;letter-spacing:.07em;font-size:13px;padding:10px 16px;border-radius:9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #7a5420;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 #7a5420}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.btn.brasa{background:linear-gradient(180deg,#f07a46,var(--brasa));border-color:#8e3412;color:#fff4e8;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 0 #8e3412}
.btn.sec{background:var(--casca-3);border-color:var(--borda);color:var(--texto);box-shadow:none}
.btn.sec:hover{border-color:var(--latao)}
.btn.peq{padding:6px 10px;font-size:12px}
.btn svg{width:16px;height:16px;flex:none}

/* ---------- Quadros (ilustrações) ---------- */
.quadro{position:relative;overflow:hidden;border-radius:8px;border:2px solid var(--latao);outline:1px solid rgba(214,162,74,.35);outline-offset:3px;background:var(--noite);max-width:100%}
.quadro img{width:100%;height:100%;object-fit:cover}

/* ---------- Missões ---------- */
.missoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.missao{display:flex;flex-direction:column;padding:12px;gap:12px}
.missao .quadro{aspect-ratio:4/5}
.missao .quadro::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,22,19,0) 45%,rgba(10,22,19,.92) 100%)}
.sobre{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;display:flex;flex-direction:column;gap:4px}
.sobre h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.sobre small{color:var(--latao-2);font-size:11.5px;font-weight:700;font-stretch:80%;text-transform:uppercase;letter-spacing:.12em}
.selos{position:absolute;top:10px;left:10px;right:10px;z-index:1;display:flex;gap:6px;flex-wrap:wrap}
.selo{font-size:10.5px;font-weight:800;font-stretch:78%;text-transform:uppercase;letter-spacing:.12em;padding:3px 8px;border-radius:999px;background:rgba(10,22,19,.82);border:1px solid var(--borda)}
.selo.luta{background:var(--brasa);border-color:#8e3412;color:#fff4e8}
.selo.chefe{background:var(--latao);border-color:#8b6326;color:var(--tinta)}
.dados{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.dados div{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--noite);border-radius:7px;padding:6px 2px}
.dados dt{font-size:9.5px;font-weight:700;font-stretch:78%;text-transform:uppercase;letter-spacing:.1em;color:var(--texto-2)}
.dados dd{margin:0;font-weight:800;font-size:14px}
.missao .btn{width:100%}

.ativa{display:grid;grid-template-columns:minmax(0,1fr);position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--latao);min-height:180px}
.ativa-fundo{position:absolute;inset:0}
.ativa-fundo img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.ativa-fundo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,22,19,.96) 0%,rgba(10,22,19,.85) 45%,rgba(10,22,19,.35) 100%)}
.ativa-corpo{position:relative;padding:20px;display:flex;flex-direction:column;gap:10px;max-width:560px}
.ativa h3{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
.ativa .barra{height:12px}
.ativa-linha{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cd{font-family:var(--f-display);font-weight:700;font-size:26px;min-width:70px;line-height:1}

/* ---------- Chefes ---------- */
.atos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.atos{grid-template-columns:1fr}}
.ato{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--borda);padding:0;cursor:pointer;text-align:left;min-height:108px;display:flex;background:var(--casca)}
.ato img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;opacity:.55;transition:opacity .2s}
.ato::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,22,19,.95),rgba(10,22,19,.5))}
.ato-txt{position:relative;z-index:1;padding:14px;display:flex;flex-direction:column;gap:2px;justify-content:flex-end}
.ato-txt b{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1}
.ato-txt small{font-size:12px;color:var(--texto-2)}
.ato[aria-pressed="true"]{border-color:var(--latao);box-shadow:0 0 0 1px var(--latao),0 10px 24px rgba(0,0,0,.4)}
.ato[aria-pressed="true"] img{opacity:.8}
.ato:disabled{cursor:not-allowed}
.ato:disabled img{filter:grayscale(1);opacity:.25}
.ato-prog{display:flex;gap:3px;margin-top:6px}
.ato-prog i{width:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.ato-prog i.ok{background:var(--latao)}

.trilha{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;align-items:center;padding:18px 14px}
.trilha::before{content:"";position:absolute;left:30px;right:30px;top:50%;height:3px;background:repeating-linear-gradient(90deg,var(--borda) 0 8px,transparent 8px 14px);transform:translateY(-50%)}
.no{position:relative;z-index:1;justify-self:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--borda);background:var(--casca);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;cursor:pointer;padding:0}
.no.ok{background:var(--latao);border-color:var(--latao-2);color:var(--tinta)}
.no.livre{border-color:var(--brasa);box-shadow:0 0 0 4px rgba(226,96,45,.18);animation:pulsa 2s infinite}
.no.trava{color:var(--texto-2);opacity:.6}
.no[aria-current="true"]{outline:2px solid var(--latao-2);outline-offset:4px}
.no.boss{width:58px;height:58px;overflow:hidden;border-color:var(--latao)}
.no.boss img{width:100%;height:100%;object-fit:cover}
.no.boss.trava img{filter:grayscale(1) brightness(.5)}
@keyframes pulsa{50%{box-shadow:0 0 0 8px rgba(226,96,45,0)}}
@media (max-width:640px){.trilha{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:16px}.trilha::before{display:none}}

.fase{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:16px}
@media (max-width:640px){.fase{grid-template-columns:1fr}}
.fase .quadro{aspect-ratio:3/4}
.fase h3{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05;margin:4px 0 6px}
.fase p{margin:0;color:var(--texto-2);max-width:56ch}
.comparar{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.cmp{display:grid;grid-template-columns:72px minmax(0,1fr) 40px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px}
.cmp .n{text-align:center;font-weight:800}
.cmp .b{height:7px;border-radius:4px;background:var(--noite);overflow:hidden}
.cmp .b i{display:block;height:100%}
.cmp .b.v i{background:var(--jade);margin-left:auto}
.cmp .b.e i{background:var(--brasa)}
.premios{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--noite);border:1px solid var(--borda);border-radius:999px;padding:4px 10px 4px 7px;font-weight:700;font-size:13px}
.chip svg{width:16px;height:16px}
.fase-acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.aviso-txt{font-size:13px;color:var(--texto-2)}

/* ---------- Arena ---------- */
.rivais{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.rival{padding:16px;display:flex;flex-direction:column;gap:12px}
.rival-topo{display:flex;gap:12px;align-items:center}
.rival-av{width:64px;height:64px;border-radius:50%;flex:none;overflow:hidden;border:2px solid var(--latao);background:radial-gradient(circle at 50% 35%,#3b4c62,#141d27 70%)}
.rival-av svg{width:100%;height:100%}
.rival h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1}
.risco{font-size:11px;font-weight:800;font-stretch:78%;text-transform:uppercase;letter-spacing:.1em}
.risco.f{color:var(--jade)}.risco.p{color:var(--latao-2)}.risco.d{color:var(--brasa)}
.mini-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;text-align:center;font-size:10.5px;color:var(--texto-2);font-weight:700;font-stretch:80%;text-transform:uppercase;letter-spacing:.06em}
.mini-st b{display:block;color:var(--texto);font-size:16px;font-stretch:100%;letter-spacing:0}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--borda);font-size:14px}
.v{color:var(--jade);font-weight:800}.d{color:var(--brasa);font-weight:800}

/* ---------- Itens ---------- */
.itens{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.item{background:linear-gradient(180deg,var(--casca-2),var(--casca));border:1px solid var(--borda);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.item::before{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--rar);opacity:.55;pointer-events:none}
.item.r2{box-shadow:0 0 22px rgba(226,96,45,.18)}
.item-topo{display:flex;gap:10px;align-items:center}
.item-ic{width:42px;height:42px;border-radius:9px;background:var(--noite);border:1px solid var(--rar);display:grid;place-items:center;color:var(--rar);flex:none}
.item-ic svg{width:24px;height:24px}
.item-nome{font-weight:800;line-height:1.2}
.item-rar{font-size:10.5px;font-weight:800;font-stretch:78%;text-transform:uppercase;letter-spacing:.12em;color:var(--rar)}
.item-st{display:flex;flex-direction:column;gap:2px;font-size:13px}
.item-st span{display:flex;justify-content:space-between;gap:8px}
.mais-v{color:var(--jade);font-weight:700}.menos-v{color:var(--brasa);font-weight:700}
.item-acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.preco{display:flex;align-items:center;gap:5px;font-weight:800;font-size:16px;margin-right:auto}
.preco svg{width:16px;height:16px}
.vazio{color:var(--texto-2);font-size:13px;justify-content:center;align-items:center;text-align:center;min-height:120px}
.equipados{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.campo{display:flex;flex-direction:column;gap:5px;max-width:360px}
.campo input{font:inherit;font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--noite);color:var(--texto);border:1px solid var(--borda);border-radius:9px;padding:8px 12px}

/* ---------- Bestiário ---------- */
.bestas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.besta{padding:12px;display:flex;flex-direction:column;gap:10px}
.besta .quadro{aspect-ratio:3/4}
.besta h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1}
.besta p{margin:0;font-size:13.5px;color:var(--texto-2)}
.besta.oculta .quadro img{filter:brightness(.12) blur(3px)}
.besta.oculta .quadro::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:64px;color:var(--latao)}

/* ---------- Combate ---------- */

  arma:['Peixeira','Estilingue','Zarabatana','Cajado de Jatobá','Facão','Arco de Pau-d’arco','Laço Trançado'],
  amuleto:['Figa de Arruda','Patuá','Fita do Bonfim','Pena de Gavião','Muiraquitã de Barro','Dente de Onça']
};
const EPITETOS = ['da Lua Cheia','do Mangue','de Jurema','do Rio Negro','de Aroeira','da Serra','do Cerrado','do Velho Chico','do Pampa'];
const RAR = [{n:'Comum',m:1},{n:'Rara',m:1.5},{n:'Lendária',m:2.2}];
const RIV_N = ['Tonho','Zefa','Biu','Rosinha','Chico','Mariá','Dito','Neném','Juca','Iracema','Bento','Lia','Tião','Dora','Quinca','Naná'];
const RIV_A = ['Ventania','Pé-Ligeiro','do Brejo','Tempestade','da Serra','Mandacaru','Jatobá','Carcará','Trovão','da Vereda'];
const BANDS = ['#8fc0d4','#e59aa0','#f1cb78','#9b6b43','#7a5fa0','#e2602d','#3fae7f'];

/* ---------- Utilidades ---------- */
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0,Math.ceil(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), r = s%60; return (h? h+':'+String(m).padStart(2,'0') : m)+':'+String(r).padStart(2,'0'); };
const $ = id => document.getElementById(id);
const xpNeed = l => Math.round(60*Math.pow(l,1.45));
const custoTreino = v => Math.round(8*Math.pow(1.11, v-6));
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
const statNome = k => STATS.find(s=>s[0]===k)[1];

/* ---------- Estado ---------- */
let S;
function novo(){
  const now = Date.now();
  const s = {v:2,nome:'Jaci',lvl:1,xp:0,vint:150,muir:12,energia:EN_MAX,enUpd:now,coragem:CO_MAX,coUpd:now,honra:0,
    stats:{for:10,fol:10,mal:8,gin:8},equip:{cabeca:null,corpo:null,arma:null,amuleto:null},mochila:[],
    ofertas:[],ativa:null,feira:[],feiraUpd:0,vitorias:{},vistos:{},duelos:[],rivais:[],tab:'missoes',uid:1,missoes:0,
    fases:[0,0,0],atoSel:0,faseSel:0,chefeEspera:0};
  s.equip.arma = {id:s.uid++,slot:'arma',nome:'Estilingue de Goiabeira',rar:0,st:{for:4,gin:1},preco:40};
  return s;
}
function carregar(){ try{ const t = localStorage.getItem(KEY); if(!t) return null; const s = JSON.parse(t); return s && s.v===2 ? s : null; }catch(e){ return null; } }
function salvar(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function total(){ const t = {...S.stats}; Object.values(S.equip).forEach(it => { if(it) for(const k in it.st) t[k] += it.st[k]; }); return t; }
const bonus = k => Object.values(S.equip).reduce((a,it)=>a+(it&&it.st[k]||0),0);
const pv = (st,lvl) => 40 + st.fol*8 + lvl*12;
const danoMedio = (st,lvl) => Math.round(st.for*1.7 + lvl*2.5);
const rank = () => RANKS.filter(r=>S.lvl>=r[0]).pop()[1];
const poolCri = () => Object.keys(CRI).filter(c => CRI[c].lvl <= S.lvl);

function genMissao(){
  const c = pick(poolCri()), cr = CRI[c], d = rnd(1,3), luta = !cr.aliado && Math.random() < .6, lv = S.lvl;
  const mult = [1,1.6,2.4][d-1] * (luta?1.3:1) * (1 + cr.lvl*.02);
  const frases = luta ? cr.lutas : cr.tarefas;
  S.vistos[c] = true;
  return {id:S.uid++, c, luta, d, f:rnd(0,frases.length-1), dur:[20,45,90][d-1], en:[6,10,15][d-1],
    xp:Math.round((12+lv*5)*mult), vint:Math.round((10+lv*6)*mult)};
}
const tituloMissao = m => (m.luta ? CRI[m.c].lutas : CRI[m.c].tarefas)[m.f];
function genItem(lv, slot, rarMin){
  slot = slot || pick(Object.keys(SLOTS));
  const roll = Math.random(); let rar = roll < .06 ? 2 : roll < .32 ? 1 : 0;
  if(rarMin != null) rar = Math.max(rar, rarMin);
  const pts = Math.round((4 + lv*1.6) * RAR[rar].m);
  const prim = PRIM[slot], outros = STATS.map(s=>s[0]).filter(k=>k!==prim);
  const st = {}; st[prim] = Math.ceil(pts*.6); const o = pick(outros); st[o] = pts - st[prim];
  const nome = pick(NOMES_ITEM[slot]) + (rar ? ' ' + pick(EPITETOS) : '');
  return {id:S.uid++, slot, nome, rar, st, preco:Math.round(pts*10*(1+lv*.08))};
}
const genFeira = () => [...Object.keys(SLOTS), pick(Object.keys(SLOTS)), pick(Object.keys(SLOTS))].map(s => genItem(S.lvl, s));
function genRival(){
  const lv = Math.max(1, S.lvl + rnd(-1,2)), t = total();
  const f = rand(.78,1.12) * (1 + (lv-S.lvl)*.06), st = {};
  STATS.forEach(([k]) => st[k] = Math.max(3, Math.round(t[k]*f*rand(.85,1.15))));
  return {id:S.uid++, nome:pick(RIV_N)+' '+pick(RIV_A), lvl:lv, st, cor:pick(BANDS), honra:Math.max(0, Math.round(S.honra*rand(.6,1.4) + rnd(0,40)))};
}
function inimigoFase(a, n){
  const [nome, c] = ATOS[a].fases[n], ls = ATOS[a].de + n, boss = n === 9;
  const m = boss ? 1.12 : .8 + .022*(n+1), base = CURVA[ls-1], st = {};
  STATS.forEach(([k]) => st[k] = Math.round(base*m*CRI[c].perf[k]));
  return {nome, c, lvl:ls, st, boss};
}
function garantir(){
  while(S.ofertas.length < 3) S.ofertas.push(genMissao());
  while(S.rivais.length < 3) S.rivais.push(genRival());
  if(!S.feira.length || Date.now() - S.feiraUpd > FEIRA_MS){ S.feira = genFeira(); S.feiraUpd = Date.now(); }
}
function regen(){
  const now = Date.now();
  if(S.energia < EN_MAX){ const g = Math.floor((now-S.enUpd)/EN_MS); if(g>0){ S.energia = Math.min(EN_MAX, S.energia+g); S.enUpd += g*EN_MS; } } else S.enUpd = now;
  if(S.coragem < CO_MAX){ const g = Math.floor((now-S.coUpd)/CO_MS); if(g>0){ S.coragem = Math.min(CO_MAX, S.coragem+g); S.coUpd += g*CO_MS; } } else S.coUpd = now;
}
function gastarEnergia(n){ if(S.energia >= EN_MAX) S.enUpd = Date.now(); S.energia -= n; }
function gastarCoragem(){ if(S.coragem >= CO_MAX) S.coUpd = Date.now(); S.coragem -= 1; }
function ganharXP(n){
  S.xp += n;
  while(S.xp >= xpNeed(S.lvl)){
    S.xp -= xpNeed(S.lvl); S.lvl++; S.muir += 1; S.energia = EN_MAX; S.enUpd = Date.now();
    aviso(`Nível ${S.lvl}! Energia cheia e +1 muiraquitã.`, true);
    Object.values(CRI).forEach(c => { if(c.lvl === S.lvl) aviso(`${c.nome} agora aparece nas missões.`, true); });
    ATOS.forEach(a => { if(a.de === S.lvl) aviso(`Novo ato de chefes: ${a.nome}.`, true); });
  }
  garantir();
}

/* ---------- Luta ---------- */
function lutador(o){ const hp = pv(o.st, o.lvl); return {...o, hp, max:hp}; }
function lutar(A, B){
  const f = [{...A},{...B}], log = [];
  let at = (f[0].st.gin + Math.random()*6 >= f[1].st.gin + Math.random()*6) ? 0 : 1;
  for(let i=0; i<40 && f[0].hp>0 && f[1].hp>0; i++){
    const a = f[at], d = f[1-at];
    const esq = clamp(d.st.gin/(d.st.gin + a.st.for + 30)*.55, .03, .35);
    const cri = clamp(a.st.mal/(a.st.mal + d.st.fol + 30)*.6, .03, .4);
    const e = {at, dmg:0, crit:false, esq:false};
    if(Math.random() < esq) e.esq = true;
    else { let dm = (a.st.for*1.7 + a.lvl*2.5) * rand(.8,1.2); if(Math.random() < cri){ dm *= 2; e.crit = true; } e.dmg = Math.max(1, Math.round(dm)); d.hp = Math.max(0, d.hp - e.dmg); }
    e.hp = [f[0].hp, f[1].hp]; log.push(e); at = 1-at;
  }
  const win = f[1].hp <= 0 || (f[0].hp > 0 && f[0].hp/f[0].max >= f[1].hp/f[1].max);
  return {win, log, A, B};
}
const meuLutador = () => lutador({nome:S.nome, lvl:S.lvl, st:total(), tipo:'heroi'});

/* ---------- Combate animado ---------- */
let anim = null, velocidade = 1;
function retrato(F){
  if(F.tipo === 'heroi') return `<div class="emblema">${heroiSVG()}</div>`;
  if(F.tipo === 'rival') return `<div class="emblema rv">${heroiSVG(F.cor)}</div>`;
  return `<img src="${IMG(F.c)}" alt="${esc(F.nome)}">`;
}
function premiosHTML(p){ return `<div class="premios" style="justify-content:center">${p.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`; }
function fecharModal(){ clearTimeout(anim); anim = null; $('modal').hidden = true; $('modal').innerHTML = ''; render(); }

function mostrarLuta(res, titulo, premios, cena){
  const {A,B,log,win} = res;
  const pl = (F,i) => `<div class="pl ${i?'r':''}"><b>${esc(F.nome)}</b><small>Nível ${F.lvl} · <span id="hpn${i}">${F.max}</span> / ${F.max} PV</small><div class="hp"><em id="hpg${i}" style="width:100%"></em><i id="hp${i}" style="width:100%"></i></div></div>`;
  const lut = (F,i) => `<div class="lut ${i?'r':''}" id="f${i}"><div class="quadro">${retrato(F)}</div></div>`;
  $('modal').innerHTML = `<div class="combate">
    <div class="cena ${cena?'':'arena'}">${cena?`<img src="${IMG(cena)}" alt="">`:''}</div>
    <div class="flash" id="flash"></div>
    <div class="comb-in">
      <div class="comb-tit"><span class="rotulo">${B.boss?'Chefe':'Combate'}</span><h2>${esc(titulo)}</h2></div>
      <div class="placar">${pl(A,0)}<span class="vs">VS</span>${pl(B,1)}</div>
      <div class="palco" id="palco">${lut(A,0)}${lut(B,1)}</div>
      <p class="narra" id="narra">Os dois se encaram…</p>
      <div class="resultado" id="fim" hidden><b class="${win?'v':'d'}">${win?'Vitória!':'Derrota'}</b>${premiosHTML(premios)}</div>
      <div class="comb-acoes">
        <button class="btn sec peq" data-act="vel" id="btnVel">Velocidade ${velocidade}×</button>
        <button class="btn sec peq" data-act="pularLuta" id="btnPular">Pular</button>
        <button class="btn" data-act="fecharModal" id="btnFechar" hidden>Continuar</button>
      </div>
    </div></div>`;
  $('modal').hidden = false;
  let i = 0;
  const reiniciar = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  const flutuar = (lado, html, cls) => { const d = document.createElement('div'); d.className = 'dano ' + (cls||''); d.innerHTML = html; $('f'+lado).appendChild(d); setTimeout(()=>d.remove(), 1100); };
  const atualizarHP = e => [0,1].forEach(k => { const F = k?B:A, p = e.hp[k]/F.max*100+'%'; $('hp'+k).style.width = p; $('hpg'+k).style.width = p; $('hpn'+k).textContent = e.hp[k]; });
  const terminar = () => {
    clearTimeout(anim); anim = null;
    $((win?'f1':'f0')).classList.add('caido');
    $('narra').hidden = true; $('fim').hidden = false;
    $('btnPular').hidden = true; $('btnVel').hidden = true; $('btnFechar').hidden = false; $('btnFechar').focus();
  };
  const turno = (animar) => {
    if(i >= log.length) return terminar();
    const e = log[i++], atk = e.at, def = 1-e.at, An = atk?B:A, Dn = atk?A:B;
    const fa = $('f'+atk), fd = $('f'+def), narra = $('narra');
    narra.className = 'narra' + (e.crit?' crit':'');
    narra.textContent = e.esq ? `${Dn.nome} esquiva na ginga!` : e.crit ? `Golpe crítico de ${An.nome}!` : `${An.nome} acerta ${Dn.nome}.`;
    if(!animar){ atualizarHP(e); return; }
    reiniciar(fa, e.crit ? 'atkc' : 'atk');
    setTimeout(() => {
      if(e.esq){ reiniciar(fd,'esquiva'); flutuar(def,'Esquivou!','esq'); return; }
      atualizarHP(e);
      if(e.crit){
        reiniciar(fd,'levac'); reiniciar($('palco'),'tremor'); reiniciar($('flash'),'on');
        flutuar(def,`<small>Crítico</small>−${e.dmg}`,'crit');
        const c = document.createElement('div'); c.className = 'corte';
        c.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M10 15 L90 85" stroke="#f1cb78" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M85 12 L22 92" stroke="#fff4e8" stroke-width="3" stroke-linecap="round" fill="none" style="animation-delay:.08s"/></svg>`;
        fd.appendChild(c); setTimeout(()=>c.remove(), 700);
      } else { reiniciar(fd,'leva'); flutuar(def,`−${e.dmg}`); }
    }, e.crit ? 280 : 200);
  };
  const ciclo = () => { if(i >= log.length){ anim = setTimeout(terminar, 500/velocidade); return; } turno(true); anim = setTimeout(ciclo, (log[i-1].crit?1150:850)/velocidade); };
  acoes.pularLuta = () => { clearTimeout(anim); while(i < log.length) turno(false); terminar(); };
  acoes.vel = () => { velocidade = velocidade === 1 ? 2 : velocidade === 2 ? 4 : 1; $('btnVel').textContent = `Velocidade ${velocidade}×`; };
  if(reduz){ acoes.pularLuta(); } else anim = setTimeout(ciclo, 600);
}

      <div><span class="rotulo">Missão cumprida</span><h2 style="font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;margin:4px 0 6px">${esc(titulo)}</h2><p style="margin:0;color:var(--texto-2)">${texto}</p></div></div>

function aviso(msg, ouro){ const d = document.createElement('div'); d.className = 'aviso' + (ouro?' ouro':''); d.textContent = msg; $('avisos').appendChild(d); setTimeout(() => d.remove(), 3400); }

/* ---------- Render: topo e herói ---------- */

}

    <div class="heroi-topo">

    <div><span class="rotulo">Equipamento</span><div class="mini-slots" style="margin-top:6px">${Object.keys(SLOTS).map(s => { const it = S.equip[s]; return `<div class="mslot ${it?'ok r'+it.rar:''}" title="${it?esc(it.nome):SLOTS[s]+' vazio'}">${SLOT_IC[s]}</div>`; }).join('')}</div></div>`;

function telaChefes(){
  const a = S.atoSel, ato = ATOS[a], feitas = S.fases[a];
  const n = Math.min(S.faseSel, 9), ini = inimigoFase(a, n), t = total();
  const liberadaAto = S.lvl >= ato.de;
  const estado = n < feitas ? 'ok' : (n === feitas && liberadaAto && S.lvl >= ini.lvl) ? 'livre' : 'trava';
  const espera = Math.max(0, S.chefeEspera - Date.now());
  const maxStat = Math.max(...STATS.map(([k]) => Math.max(t[k], ini.st[k])));
  const xpR = Math.round(xpNeed(ini.lvl)*(ini.boss?.5:.18)), vR = (40+ini.lvl*25)*(ini.boss?3:1);
  let motivo = '';
  if(estado === 'ok') motivo = 'Fase vencida.';
  else if(!liberadaAto) motivo = `Este ato abre no nível ${ato.de}.`;
  else if(n > feitas) motivo = `Vença a fase ${feitas+1} primeiro.`;
  else if(S.lvl < ini.lvl) motivo = `Exige nível ${ini.lvl}.`;
  return `<div style="display:flex;flex-direction:column;gap:16px">
    <div class="sec-topo"><div><h2>Torre dos Chefes</h2><p>Três atos de dez fases. Cada fase exige um nível mínimo e só pode ser vencida uma vez. A décima fase de cada ato é o chefe. Cada tentativa gasta ${CHEFE_EN} de energia.</p></div></div>
    <div class="atos" role="group" aria-label="Atos">${ATOS.map((x,i) => `<button class="ato" aria-pressed="${a===i}" data-act="ato" data-id="${i}" ${S.lvl<x.de?'disabled':''}>
      <img src="${IMG(x.capa)}" alt=""><span class="ato-txt"><span class="rotulo">Ato ${['I','II','III'][i]} · nível ${x.de}–${x.ate}</span><b>${x.nome}</b>
      <span class="ato-prog">${Array.from({length:10},(_,k)=>`<i class="${k<S.fases[i]?'ok':''}"></i>`).join('')}</span>
      ${S.lvl<x.de?`<small>Abre no nível ${x.de}</small>`:''}</span></button>`).join('')}</div>
    <div class="painel">
      <div class="trilha">${ato.fases.map((f,k) => { const lv = ato.de+k, st = k<feitas?'ok':(k===feitas&&S.lvl>=lv&&liberadaAto)?'livre':'trava';
        return k===9 ? `<button class="no boss ${st}" data-act="fase" data-id="${k}" aria-current="${n===k}" aria-label="Chefe: ${esc(f[0])}"><img src="${IMG(f[1])}" alt=""></button>`
          : `<button class="no ${st}" data-act="fase" data-id="${k}" aria-current="${n===k}" aria-label="Fase ${k+1}: ${esc(f[0])}">${k+1}</button>`; }).join('')}</div>
      <div class="fase" style="border-top:1px solid var(--borda)">
        <div class="quadro"><img src="${IMG(ini.c)}" alt="${esc(CRI[ini.c].nome)}">
          <div class="selos"><span class="selo ${ini.boss?'chefe':'luta'}">${ini.boss?'Chefe':'Fase '+(n+1)}</span></div></div>
        <div style="min-width:0">
          <span class="rotulo">Ato ${['I','II','III'][a]} · fase ${n+1} de 10 · nível ${ini.lvl}</span>
          <h3>${esc(ini.nome)}</h3>
          <p>${CRI[ini.c].lore}</p>
          <div class="comparar">
            <div class="cmp" style="font-size:11px;color:var(--texto-2)"><span></span><span style="text-align:right">Você</span><span></span><span>${esc(CRI[ini.c].nome)}</span><span></span></div>
            ${STATS.map(([k,nm]) => `<div class="cmp"><span>${nm}</span><span class="b v"><i style="width:${t[k]/maxStat*100}%"></i></span><span class="n">${t[k]}</span><span class="b e"><i style="width:${ini.st[k]/maxStat*100}%"></i></span><span class="n">${ini.st[k]}</span></div>`).join('')}
          </div>
          <span class="rotulo">Recompensa da primeira vitória</span>
          <div class="premios" style="margin-top:6px"><span class="chip">+${xpR} XP</span><span class="chip">${IC.vint}${vR}</span>${ini.boss?`<span class="chip">${IC.muir}+3</span><span class="chip">Item raro ou lendário</span>`:''}</div>
          <div class="fase-acoes">
            ${estado==='livre' ? `<button class="btn brasa" data-act="enfrentar" ${espera||S.energia<CHEFE_EN?'disabled':''}>Enfrentar · ${CHEFE_EN} energia</button>
              ${espera?`<span class="aviso-txt">Recuperando-se da derrota: <b data-espera>${fmt(espera/1000)}</b></span>`:S.energia<CHEFE_EN?`<span class="aviso-txt">Falta energia.</span>`:''}`
              : `<span class="aviso-txt">${motivo}</span>`}
          </div>
        </div></div></div></div>`;
}

function telaArena(){
  const t = total(), meu = STATS.reduce((a,[k])=>a+t[k],0);
  return `<div style="display:flex;flex-direction:column;gap:18px">
    <div class="sec-topo"><div><h2>Arena da Roda</h2><p>Desafie outros guardiões e ganhe honra. Cada duelo gasta 1 de coragem, que volta sozinha a cada 2 minutos.</p></div>
      <span class="chip" style="font-size:15px;padding:6px 12px 6px 8px">${IC.honra}${S.honra} de honra</span></div>
    <div class="rivais">${S.rivais.map(r => { const sum = STATS.reduce((a,[k])=>a+r.st[k],0);
      const [cls,txt] = sum > meu*1.08 ? ['d','Mais forte'] : sum < meu*.92 ? ['f','Mais fraco'] : ['p','Parelho'];
      return `<article class="painel rival">
        <div class="rival-topo"><div class="rival-av">${heroiSVG(r.cor)}</div><div style="min-width:0"><h3>${esc(r.nome)}</h3><span class="aviso-txt">Nível ${r.lvl} · ${r.honra} de honra</span><br><span class="risco ${cls}">${txt}</span></div></div>
        <div class="mini-st">${STATS.map(([k,n]) => `<div>${n}<b>${r.st[k]}</b></div>`).join('')}</div>
        <button class="btn brasa" data-act="desafiar" data-id="${r.id}" ${S.coragem<1?'disabled':''}>Desafiar · 1 coragem</button>
      </article>`; }).join('')}</div>
    <section class="painel" style="padding:16px"><span class="rotulo">Últimos duelos</span>
      ${S.duelos.length ? `<ul class="lista" style="margin-top:6px">${S.duelos.map(d => `<li><span>${esc(d.nome)}</span><span class="${d.win?'v':'d'}">${d.win?'Venceu':'Perdeu'} · ${d.win?'+':''}${d.honra} honra</span></li>`).join('')}</ul>` : `<p class="aviso-txt" style="margin:8px 0 0">Nenhum duelo ainda. Os resultados aparecem aqui.</p>`}
    </section></div>`;
}

function itemHTML(it, acoes, comparar){
  let linhas = Object.entries(it.st).map(([k,v]) => `<span><span>${statNome(k)}</span><b class="mais-v">+${v}</b></span>`).join('');
  if(comparar){
    const atual = S.equip[it.slot]; const keys = new Set([...Object.keys(it.st), ...Object.keys(atual?atual.st:{})]);
    const delta = [...keys].map(k => { const d = (it.st[k]||0) - (atual&&atual.st[k]||0); return d ? `<b class="${d>0?'mais-v':'menos-v'}">${d>0?'+':''}${d} ${statNome(k)}</b>` : ''; }).filter(Boolean).join(' · ');
    linhas += `<span style="margin-top:4px;font-size:12px;color:var(--texto-2);display:block">${atual ? 'Comparado ao equipado: ' + (delta || 'igual') : 'Espaço vazio'}</span>`;
  }
  return `<div class="item r${it.rar}">
    <div class="item-topo"><div class="item-ic">${SLOT_IC[it.slot]}</div><div style="min-width:0"><div class="item-rar">${RAR[it.rar].n} · ${SLOTS[it.slot]}</div><div class="item-nome">${esc(it.nome)}</div></div></div>
    <div class="item-st">${linhas}</div>
    ${acoes ? `<div class="item-acoes">${acoes}</div>` : ''}</div>`;
}
function telaFeira(){
  return `<div style="display:flex;flex-direction:column;gap:18px">
    <div class="sec-topo"><div><h2>Feira do Arraial</h2><p>Mercadorias novas a cada 10 minutos. Próxima troca em <b data-feira>${fmt((FEIRA_MS-(Date.now()-S.feiraUpd))/1000)}</b>.</p></div>
      <button class="btn sec" data-act="renovarFeira">${IC.muir} Trocar agora por 1</button></div>
    <div class="itens">${S.feira.length ? S.feira.map(it => itemHTML(it, `<span class="preco">${IC.vint}${it.preco}</span><button class="btn peq" data-act="comprar" data-id="${it.id}" ${S.vint<it.preco?'disabled':''}>Comprar</button>`, true)).join('') : `<div class="item vazio">Você comprou tudo. Volte na próxima troca.</div>`}</div></div>`;
}
let confirmarReset = false;
function telaMochila(){
  return `<div style="display:flex;flex-direction:column;gap:18px">
    <div class="sec-topo"><div><h2>Mochila</h2><p>Itens equipados somam atributos ao seu guardião.</p></div>
      <div class="campo"><label class="rotulo" for="nomeHeroi">Nome do guardião</label><input id="nomeHeroi" maxlength="18" value="${esc(S.nome)}" autocomplete="off"></div></div>
    <span class="rotulo">Equipado</span>
    <div class="equipados">${Object.keys(SLOTS).map(s => S.equip[s] ? itemHTML(S.equip[s], `<button class="btn sec peq" data-act="desequipar" data-id="${s}">Guardar</button>`) : `<div class="item vazio"><div class="item-ic" style="--rar:var(--borda)">${SLOT_IC[s]}</div>${SLOTS[s]} vazio</div>`).join('')}</div>
    <span class="rotulo">Na mochila · ${S.mochila.length} de ${MOCHILA}</span>
    ${S.mochila.length ? `<div class="itens">${S.mochila.map(it => itemHTML(it, `<button class="btn peq" data-act="equipar" data-id="${it.id}">Equipar</button><button class="btn sec peq" data-act="vender" data-id="${it.id}">Vender · ${Math.round(it.preco*.3)}</button>`, true)).join('')}</div>`
      : `<p class="aviso-txt" style="margin:0">Itens comprados na Feira ou ganhos em missões e chefes aparecem aqui.</p>`}</div>`;
}
function telaBestiario(){
  return `<div style="display:flex;flex-direction:column;gap:18px">
    <div class="sec-topo"><div><h2>Bestiário</h2><p>As lendas que você já encontrou. Cada uma é revelada quando aparece pela primeira vez no seu caminho.</p></div></div>
    <div class="bestas">${Object.entries(CRI).map(([id,c]) => { const visto = S.vistos[id], v = S.vitorias[id]||0;
      return `<article class="painel besta ${visto?'':'oculta'}"><div class="quadro"><img src="${IMG(id)}" alt="${visto?esc(c.nome):'Lenda desconhecida'}" loading="lazy"></div>
        <div><span class="rotulo">${visto ? c.lugar + (c.aliado ? ' · aliado' : ' · ' + (v ? v + ' vitória' + (v>1?'s':'') : 'nenhuma vitória')) : 'Aparece a partir do nível ' + c.lvl}</span>
        <h3>${visto?c.nome:'Lenda desconhecida'}</h3></div>
        <p>${visto?c.lore:'Continue suas missões para encontrar esta figura.'}</p></article>`; }).join('')}</div></div>`;
}

function renderTela(){
  const t = {missoes:telaMissoes, chefes:telaChefes, arena:telaArena, feira:telaFeira, mochila:telaMochila, bestiario:telaBestiario}[S.tab] || telaMissoes;
  $('tela').innerHTML = t(); contagens();
}
function renderRodape(){
  $('rodape').innerHTML = `<span>O progresso fica salvo neste navegador.</span>` + (confirmarReset
    ? `<span>Apagar todo o progresso? <button class="linkbtn perigo" data-act="resetOk">Sim, começar de novo</button> · <button class="linkbtn" data-act="resetNao">Cancelar</button></span>`
    : `<button class="linkbtn" data-act="reset">Começar novo jogo</button>`);
}
function render(){ renderRecursos(); renderHeroi(); renderAbas(); renderTela(); renderRodape(); }
function contagens(){
  if(S.ativa){
    const left = Math.max(0, S.ativa.fim - Date.now());
    document.querySelectorAll('[data-cd]').forEach(el => el.textContent = left ? fmt(left/1000) : 'Pronto');
    document.querySelectorAll('[data-barra]').forEach(el => el.style.width = (100 - left/(S.ativa.dur*1000)*100) + '%');
  }
  const f = document.querySelector('[data-feira]'); if(f) f.textContent = fmt((FEIRA_MS-(Date.now()-S.feiraUpd))/1000);
  const e = document.querySelector('[data-espera]'); if(e) e.textContent = fmt((S.chefeEspera-Date.now())/1000);
}

/* ---------- Ações ---------- */
const acoes = {
  tab:d => { S.tab = d.id; confirmarReset = false; salvar(); render(); },
  partir:d => {
    if(S.ativa) return aviso('Termine a missão atual primeiro.');
    const i = S.ofertas.findIndex(m => m.id == d.id); if(i<0) return;
    const m = S.ofertas[i];
    if(S.energia < m.en) return aviso(`Falta energia: precisa de ${m.en}.`);
    gastarEnergia(m.en); S.ativa = {...m, fim:Date.now() + m.dur*1000};
    S.ofertas.splice(i,1); garantir(); salvar(); render();
  },
  pular:() => { if(!S.ativa) return; if(S.muir < 1) return aviso('Você não tem muiraquitãs.'); S.muir -= 1; S.ativa.fim = Date.now(); salvar(); render(); },
  concluir:() => {
    const m = S.ativa; if(!m || Date.now() < m.fim) return;
    S.ativa = null; S.missoes++;
    const c = CRI[m.c], t = total(), premios = [], titulo = tituloMissao(m);
    const drop = () => { if(Math.random() < .2 && S.mochila.length < MOCHILA){ const it = genItem(S.lvl); S.mochila.push(it); premios.push('Item: ' + esc(it.nome)); } };
    if(m.luta){
      const mult = [.78,.95,1.12][m.d-1], st = {};
      STATS.forEach(([k]) => st[k] = Math.max(3, Math.round(t[k]*mult*c.perf[k]*rand(.9,1.1))));
      const res = lutar(meuLutador(), lutador({nome:c.nome, lvl:S.lvl, st, c:m.c}));
      if(res.win){ S.vint += m.vint; premios.push(`${IC.vint}+${m.vint}`, `+${m.xp} XP`); S.vitorias[m.c] = (S.vitorias[m.c]||0)+1; drop(); ganharXP(m.xp); }
      else { const x = Math.round(m.xp*.3); premios.push(`+${x} XP pela tentativa`); ganharXP(x); }
      salvar(); render(); mostrarLuta(res, titulo, premios, m.c);
    } else {
      S.vint += m.vint; premios.push(`${IC.vint}+${m.vint}`, `+${m.xp} XP`); drop(); ganharXP(m.xp);
      salvar(); render(); mostrarSimples(titulo, m.c, `${c.nome} · ${c.lugar}`, premios);
    }
  },
  renovarMissoes:() => { if(S.muir < 1) return aviso('Você não tem muiraquitãs.'); S.muir -= 1; S.ofertas = []; garantir(); salvar(); render(); },
  recarregar:() => {
    if(S.energia >= EN_MAX) return aviso('Sua energia já está cheia.');
    if(S.muir < 2) return aviso('Recarregar custa 2 muiraquitãs.');
    S.muir -= 2; S.energia = EN_MAX; S.enUpd = Date.now(); aviso('Energia recarregada.'); salvar(); render();
  },
  treinar:d => { const c = custoTreino(S.stats[d.id]); if(S.vint < c) return; S.vint -= c; S.stats[d.id]++; salvar(); renderRecursos(); renderHeroi(); renderTela(); },
  equipar:d => { const i = S.mochila.findIndex(x => x.id == d.id); if(i<0) return; const it = S.mochila.splice(i,1)[0], velho = S.equip[it.slot]; S.equip[it.slot] = it; if(velho) S.mochila.push(velho); salvar(); render(); },
  desequipar:d => { if(S.mochila.length >= MOCHILA) return aviso('Mochila cheia. Venda algo antes.'); S.mochila.push(S.equip[d.id]); S.equip[d.id] = null; salvar(); render(); },
  vender:d => { const i = S.mochila.findIndex(x => x.id == d.id); if(i<0) return; const it = S.mochila.splice(i,1)[0], v = Math.round(it.preco*.3); S.vint += v; aviso(`Vendido por ${v} vinténs.`); salvar(); render(); },
  comprar:d => {
    const i = S.feira.findIndex(x => x.id == d.id); if(i<0) return; const it = S.feira[i];
    if(S.vint < it.preco) return aviso('Faltam vinténs.');
    if(!S.equip[it.slot]){ S.vint -= it.preco; S.feira.splice(i,1); S.equip[it.slot] = it; aviso(`${it.nome} equipado.`); }
    else { if(S.mochila.length >= MOCHILA) return aviso('Mochila cheia. Venda algo antes.'); S.vint -= it.preco; S.feira.splice(i,1); S.mochila.push(it); aviso(`${it.nome} foi para a mochila.`); }
    salvar(); render();
  },
  renovarFeira:() => { if(S.muir < 1) return aviso('Você não tem muiraquitãs.'); S.muir -= 1; S.feira = genFeira(); S.feiraUpd = Date.now(); salvar(); render(); },
  desafiar:d => {
    if(S.coragem < 1) return aviso('Sem coragem. Espere ela voltar.');
    const i = S.rivais.findIndex(r => r.id == d.id); if(i<0) return;
    const r = S.rivais[i]; gastarCoragem();
    const res = lutar(meuLutador(), lutador({nome:r.nome, lvl:r.lvl, st:r.st, tipo:'rival', cor:r.cor}));
    const premios = []; let h;
    if(res.win){ h = Math.max(5, 10 + (r.lvl-S.lvl)*3); const v = 8 + S.lvl*4, x = 5 + S.lvl*2; S.honra += h; S.vint += v; premios.push(`${IC.honra}+${h} honra`, `${IC.vint}+${v}`, `+${x} XP`); ganharXP(x); }
    else { h = -Math.min(S.honra, 4); S.honra += h; premios.push(`${IC.honra}${h} honra`); }
    S.duelos.unshift({nome:r.nome, win:res.win, honra:h}); S.duelos = S.duelos.slice(0,6);
    S.rivais.splice(i,1); garantir(); salvar(); render();
    mostrarLuta(res, `Duelo contra ${r.nome}`, premios, null);
  },
  ato:d => { S.atoSel = +d.id; S.faseSel = Math.min(S.fases[S.atoSel], 9); salvar(); renderTela(); },
  fase:d => { S.faseSel = +d.id; salvar(); renderTela(); },
  enfrentar:() => {
    const a = S.atoSel, n = S.faseSel, ini = inimigoFase(a, n);
    if(n !== S.fases[a] || S.lvl < ini.lvl || S.lvl < ATOS[a].de) return;
    if(Date.now() < S.chefeEspera) return aviso('Você ainda está se recuperando.');
    if(S.energia < CHEFE_EN) return aviso('Falta energia.');
    gastarEnergia(CHEFE_EN); S.vistos[ini.c] = true;
    const res = lutar(meuLutador(), lutador({nome:ini.nome, lvl:ini.lvl, st:ini.st, c:ini.c, boss:ini.boss}));
    const premios = [];
    if(res.win){
      const xp = Math.round(xpNeed(ini.lvl)*(ini.boss?.5:.18)), v = (40+ini.lvl*25)*(ini.boss?3:1);
      S.vint += v; premios.push(`${IC.vint}+${v}`, `+${xp} XP`);
      S.vitorias[ini.c] = (S.vitorias[ini.c]||0)+1; S.fases[a] = n+1; S.faseSel = Math.min(n+1, 9);
      if(ini.boss){
        S.muir += 3; premios.push(`${IC.muir}+3`);
        const it = genItem(ini.lvl, null, Math.random()<.5?2:1);
        if(S.mochila.length < MOCHILA){ S.mochila.push(it); premios.push('Item: ' + esc(it.nome)); } else { S.vint += it.preco; premios.push('Mochila cheia: item vendido'); }
        aviso(`Ato ${['I','II','III'][a]} concluído!`, true);
      }
      ganharXP(xp);
    } else { S.chefeEspera = Date.now() + CHEFE_ESPERA; premios.push('Treine ou equipe itens melhores e tente de novo'); }
    salvar(); render(); mostrarLuta(res, ini.nome, premios, ini.c);
  },
  fecharModal:() => fecharModal(),
  pularLuta:() => {}, vel:() => {},
  reset:() => { confirmarReset = true; renderRodape(); },
  resetNao:() => { confirmarReset = false; renderRodape(); },
  resetOk:() => { confirmarReset = false; S = novo(); garantir(); salvar(); render(); aviso('Novo jogo iniciado.'); }
};

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if(!b || b.disabled) return; const f = acoes[b.dataset.act]; if(f) f(b.dataset); });
document.addEventListener('change', e => { if(e.target.id === 'nomeHeroi'){ S.nome = e.target.value.trim().slice(0,18) || 'Jaci'; salvar(); renderHeroi(); } });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('modal').hidden && !anim) fecharModal(); });

let ultimoPronto = null, ultimaEspera = null, conta = 0;
function tick(){
  const enAntes = S.energia;
  regen();
  if(Date.now() - S.feiraUpd > FEIRA_MS){ S.feira = genFeira(); S.feiraUpd = Date.now(); if(S.tab === 'feira') renderTela(); }
  renderRecursos(); contagens();
  const pronto = !!(S.ativa && Date.now() >= S.ativa.fim);
  if(pronto !== ultimoPronto){ ultimoPronto = pronto; renderAbas(); if(S.tab === 'missoes') renderTela(); if(pronto) aviso('Missão pronta!', true); }
  const esperando = Date.now() < S.chefeEspera;
  if(esperando !== ultimaEspera){ ultimaEspera = esperando; if(S.tab === 'chefes') renderTela(); }
  if(S.energia !== enAntes && (S.tab === 'missoes' || S.tab === 'chefes') && $('modal').hidden){
    const precisa = S.tab === 'chefes' ? CHEFE_EN : Math.min(...S.ofertas.map(m=>m.en));
    if((enAntes < precisa) !== (S.energia < precisa) || S.energia === EN_MAX) renderTela();
  }
  if(++conta % 5 === 0) salvar();
}
function start(data){
  S = (data && data.S) || carregar() || novo();
  garantir(); regen(); ultimoPronto = !!(S.ativa && Date.now() >= S.ativa.fim); ultimaEspera = Date.now() < S.chefeEspera;
  render(); setInterval(tick, 1000);
}
try{ window.claude?.hot?.snapshot?.(() => ({S})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</html>
