name: Criar Release da versão

# Quando um merge no main traz um número novo em `config/version` (game/project.godot),
# este workflow cria a tag vX.Y.Z e a Release com a nota de docs/versoes/vX.Y.Z.md.
# Versões que não são X.Y.Z exato (como "0.3.0-dev") não criam nada.
on:
  push:
    branches: [main]
    paths: ['game/project.godot', 'docs/versoes/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Ler versão do jogo
        id: v
        run: |
          V=$(grep -oP '^config/version="\K[0-9]+\.[0-9]+\.[0-9]+(?=")' game/project.godot || true)
          if [ -z "$V" ]; then
            echo "Versão em game/project.godot não é X.Y.Z exato. Nada a fazer."
            exit 0
          fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Versão encontrada: v$V"
      - name: Criar tag e Release se ainda não existirem
        if: steps.v.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A Release $TAG já existe. Nada a fazer."
            exit 0
          fi
          NOTA="docs/versoes/${TAG}.md"
          if [ ! -f "$NOTA" ]; then
            echo "::error::Falta a nota da versão em $NOTA"
            exit 1
          fi
          TITULO=$(head -1 "$NOTA" | sed 's/^# *//')
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITULO" --notes-file "$NOTA"
